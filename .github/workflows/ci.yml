name: Execução Cypress via CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_mensagem:
        description: 'Mensagem do commit do repositório de páginas'
        required: false

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v3

      - name: 🟢 Instalar dependências
        run: npm ci

      - name: 🧪 Executar testes E2E
        run: npx cypress run

      - name: 📝 Mostrar commit do repositório de páginas
        run: |
          if [ -n "${{ github.event.inputs.commit_mensagem }}" ]; then
            echo "🔗 Commit externo: ${{ github.event.inputs.commit_mensagem }}"
          else
            echo "Nenhuma mensagem de commit externo recebida."
          fi

      - name: 📤 Fazer upload de screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: cypress/screenshots

      - name: 📤 Fazer upload de vídeos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: cypress/videos
